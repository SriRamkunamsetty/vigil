[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vigil"
version = "0.1.0"
description = "Real-time scam interception, mule-network intelligence and agent-payment guardrails for BFSI, built on Google ADK and Gemini."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Team SITA" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "networkx>=3.3",
  "numpy>=1.26",
  "cryptography>=43",
  "google-adk[a2a]>=2.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "playwright>=1.47",
]

[project.scripts]
vigil-eval = "vigil.eval.run:main"
vigil-serve = "vigil.api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D", "S", "C4", "PIE", "RUF"]
ignore = [
  "D100", "D104", "D105", "D107", "D203", "D213",
  "RUF001", "RUF002", "RUF003",  # Indic-script strings are intentional
  "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S105", "S106", "S311", "E501", "E741", "RUF012"]
"src/vigil/synthetic/**" = ["S311", "E501"]
"src/vigil/agents/**" = ["E501"]
"src/vigil/api/**" = ["E501"]
"src/vigil/payments/**" = ["E501"]
"src/vigil/risk/scam_signals.py" = ["E501"]
"src/vigil/demo_data.py" = ["E501"]
"src/vigil/risk/lexicon.py" = ["E501"]
"src/vigil/risk/interventions.py" = ["E501"]
"scripts/**" = ["D", "S", "E501"]
"src/vigil/api/main.py" = ["S104"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/vigil"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not e2e'"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
asyncio_mode = "auto"
markers = ["e2e: browser end-to-end tests (need Chromium)"]

[tool.coverage.run]
source = ["src/vigil"]
